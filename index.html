<html>

<head>
  <link rel="icon" type="image/png" href="Image/Icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>

<body>
  <img class="logo" src="Image/CyberAcme_Company_Logo_Crop.png" alt="CyberAcme Logo">
  <div class="alphabet-grid">
    <div class="start">Press a green symbol to start.</div>
    <div class="columns-container">
      <div class="column"><span>A</span><span>A</span></div>
      <div class="column"><span>B</span><span>B</span></div>
      <div class="column"><span>C</span><span>C</span></div>
      <div class="column"><span>D</span><span>D</span></div>
      <div class="column"><span>E</span><span>E</span></div>
      <div class="column"><span>F</span><span>F</span></div>
      <div class="column"><span>G</span><span>G</span></div>
      <div class="column"><span>H</span><span>H</span></div>
      <div class="column"><span>I</span><span>I</span></div>
      <div class="column"><span>J</span><span>J</span></div>
      <div class="column"><span>K</span><span>K</span></div>
      <div class="column"><span>L</span><span>L</span></div>
      <div class="column"><span>M</span><span>M</span></div>
      <div class="column"><span>N</span><span>N</span></div>
      <div class="column"><span>O</span><span>O</span></div>
      <div class="column"><span>P</span><span>P</span></div>
      <div class="column"><span>Q</span><span>Q</span></div>
      <div class="column"><span>R</span><span>R</span></div>
      <div class="column"><span>S</span><span>S</span></div>
      <div class="column"><span>T</span><span>T</span></div>
      <div class="column"><span>U</span><span>U</span></div>
      <div class="column"><span>V</span><span>V</span></div>
      <div class="column"><span>W</span><span>W</span></div>
      <div class="column"><span>X</span><span>X</span></div>
      <div class="column"><span>Y</span><span>Y</span></div>
      <div class="column"><span>Z</span><span>Z</span></div>
      <div class="column"><span>1</span><span>1</span></div>
      <div class="column"><span>2</span><span>2</span></div>
      <div class="column"><span>3</span><span>3</span></div>
      <div class="column"><span>4</span><span>4</span></div>
      <div class="column"><span>5</span><span>5</span></div>
      <div class="column"><span>6</span><span>6</span></div>
      <div class="column"><span>7</span><span>7</span></div>
      <div class="column"><span>8</span><span>8</span></div>
      <div class="column"><span>9</span><span>9</span></div>
      <div class="column"><span>0</span><span>0</span></div>
      <div class="column"><span>@</span><span>@</span></div>
      <div class="column"><span>&</span><span>&</span></div>
    </div>
    <div class="button-row">
      <button id="clear-btn">Clear</button>
      <div class="typed-row"></div>
      <button id="backspace-btn">Backs</button>
    </div>
    <div class="copy-row">
      <button id="copy-btn">Copy</button>
    </div>
    </div>
  </div>
</body>

</html>
